  <style>
    :root {
      --ink: #202124;
      --muted: #676f7a;
      --accent: #6b7280;
      --ring: rgba(107, 114, 128, 0.22);
      --border: rgba(32, 33, 36, 0.12);
      --shadow: 0 10px 24px rgba(32, 33, 36, 0.08);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      color: var(--ink);
      font-family: "Segoe UI", "Trebuchet MS", "Helvetica Neue", sans-serif;
      background: #ffffff;
    }

    .page {
      width: min(1000px, 92vw);
      margin: 20px auto 28px;
    }

    .hero {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #ffffff;
      box-shadow: var(--shadow);
      padding: clamp(16px, 3vw, 28px);
      animation: fadeInUp 0.45s ease-out;
    }

    h1 {
      margin: 0;
      line-height: 1.1;
      letter-spacing: 0.2px;
      font-size: clamp(1.45rem, 4vw, 2.3rem);
    }

    .sub {
      margin: 8px 0 18px;
      color: var(--muted);
      font-size: clamp(0.93rem, 2.7vw, 1.02rem);
    }

    .search-wrap {
      position: relative;
      display: grid;
      gap: 8px;
      margin-top: 20px;
    }

    .filter-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-row select,
    .filter-row input {
      flex: 1 1 280px;
    }

    .filter-row select {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #ffffff;
      color: var(--ink);
      outline: none;
      padding: 12px 14px;
      font-size: 1rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .filter-row select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--ring);
    }

    .search-wrap input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #ffffff;
      color: var(--ink);
      outline: none;
      padding: 12px 14px;
      font-size: 1rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--ring);
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.95rem;
      flex-wrap: wrap;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 2px;
    }

    .refresh-btn {
      border: 1px solid rgba(32, 33, 36, 0.2);
      border-radius: 10px;
      background: #ffffff;
      color: #2b3138;
      font-size: 0.9rem;
      padding: 8px 10px;
      cursor: pointer;
    }

    .refresh-btn:disabled {
      cursor: default;
      opacity: 0.6;
    }

    .list {
      list-style: none;
      margin: 16px 0 0;
      padding: 0;
      display: block;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #ffffff;
      overflow: hidden;
      animation: fadeIn 0.5s ease;
    }

    .item {
      margin: 0;
      padding: 11px 14px;
      line-height: 1.35;
      background: transparent;
      border-bottom: 1px solid rgba(32, 33, 36, 0.09);
    }

    .item:last-child {
      border-bottom: 0;
    }

    .empty {
      margin: 16px 0 0;
      border: 1px dashed rgba(32, 33, 36, 0.25);
      border-radius: 12px;
      background: #ffffff;
      color: var(--muted);
      padding: 14px;
      text-align: center;
    }

    .status {
      margin-top: 12px;
      color: #7e2e2e;
      font-size: 0.95rem;
    }

    .pill {
      border: 1px solid rgba(32, 33, 36, 0.18);
      color: #4f5661;
      background: #ffffff;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 0.83rem;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .page {
        width: 94vw;
        margin-top: 14px;
      }

      .hero {
        border-radius: 14px;
        padding: 14px;
      }

      .item {
        padding: 10px 12px;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

  </style>
</head>

      function renderList(items) {
        listEl.innerHTML = '';

        if (!items.length) {
          emptyEl.hidden = false;
          return;
        }

        emptyEl.hidden = true;
        var frag = document.createDocumentFragment();
        for (var i = 0; i < items.length; i += 1) {
          var item = items[i];
          var li = document.createElement('li');
          li.className = 'item';
          li.textContent = formatItemLabel(item);
          frag.appendChild(li);
        }
        listEl.appendChild(frag);
      }

      function formatItemLabel(item) {
        var selectedSubcategory = subcategoryFilter ? normalize(subcategoryFilter.value) : '';
        var label = item.title || '';
        if (item.variant) {
          label += ' - ' + item.variant;
        }
        if (!selectedSubcategory && item.subcategory_name) {
          label += ' (' + item.subcategory_name + ')';
        }
        return label;
      }

      function populateCategories(categories) {
        if (!Array.isArray(categories) || !categoryFilter) {
          return;
        }

        for (var i = 0; i < categories.length; i += 1) {
          var category = categories[i];
          var option = document.createElement('option');
          option.value = String(category.id);
          option.textContent = category.name;
          categoryFilter.appendChild(option);
        }
      }

      function collectVisibleSubcategories() {
        var selectedCategory = categoryFilter ? categoryFilter.value : '';
        var seen = Object.create(null);
        var subcategories = [];

        for (var i = 0; i < items.length; i += 1) {
          var item = items[i];
          var matchesCategory = !selectedCategory || String(item.category_id) === selectedCategory;
          var subName = String(item.subcategory_name || '').trim();

          if (!matchesCategory || !subName) {
            continue;
          }

          var key = normalize(subName);
          if (!seen[key]) {
            seen[key] = true;
            subcategories.push(subName);
          }
        }

        subcategories.sort(function (a, b) {
          return a.localeCompare(b);
        });

        return subcategories;
      }

      function populateSubcategories() {
        if (!subcategoryFilter) {
          return [];
        }

        subcategoryFilter.innerHTML = '';

        var allOption = document.createElement('option');
        allOption.value = '';
        allOption.textContent = 'All Subcategories';
        subcategoryFilter.appendChild(allOption);

        var subcategories = collectVisibleSubcategories();
        for (var i = 0; i < subcategories.length; i += 1) {
          var option = document.createElement('option');
          option.value = subcategories[i];
          option.textContent = subcategories[i];
          subcategoryFilter.appendChild(option);
        }

        return subcategories;
      }

      function applyFilter() {
        var query = normalize(searchInput.value);
        var selectedCategory = categoryFilter ? categoryFilter.value : '';
        var selectedSubcategory = subcategoryFilter ? normalize(subcategoryFilter.value) : '';

        var filtered = items.filter(function (item) {
          var matchesCategory = !selectedCategory || String(item.category_id) === selectedCategory;
          if (!matchesCategory) {
            return false;
          }

          var itemSubcategory = normalize(item.subcategory_name);
          var matchesSubcategory = !selectedSubcategory || itemSubcategory === selectedSubcategory;
          if (!matchesSubcategory) {
            return false;
          }

          if (!query) {
            return true;
          }

          var searchableText = [item.title, item.variant, item.subcategory_name].join(' ');
          return normalize(searchableText).indexOf(query) !== -1;
        });

        renderList(filtered);
        resultCountEl.textContent = filtered.length + ' of ' + items.length + ' items';
      }

      function showError(message) {
        statusEl.style.color = '#7e2e2e';
        statusEl.textContent = message;
        resultCountEl.textContent = 'Could not load items';
      }

      function showInfo(message) {
        statusEl.style.color = '#4f5661';
        statusEl.textContent = message;
      }

      function refreshCachedCopy() {
        if (!('serviceWorker' in navigator)) {
          showError('Service worker is not supported in this browser.');
          return;
        }

        refreshCacheBtn.disabled = true;
        showInfo('Refreshing cached copy...');

        Promise.all([
          fetch('/index.html', { cache: 'no-store' }).then(function (response) {
            if (!response.ok) {
              throw new Error('HTTP ' + response.status);
            }
          }),
          navigator.serviceWorker.getRegistration().then(function (registration) {
            if (registration) {
              return registration.update();
            }
          })
        ])
          .then(function () {
            showInfo('Cached copy updated. Reloading...');
            setTimeout(function () {
              window.location.reload();
            }, 350);
          })
          .catch(function (err) {
            showError('Refresh failed. (' + err.message + ')');
            refreshCacheBtn.disabled = false;
          });
      }

      function readEmbeddedData() {
        if (!embeddedDataEl) {
          throw new Error('Embedded data block not found');
        }

        var payload = embeddedDataEl.textContent || '';
        if (!payload.trim()) {
          throw new Error('Embedded data is empty');
        }

        return JSON.parse(payload);
      }

      function getInitialFiltersFromUrl() {
        if (typeof URLSearchParams !== 'function') {
          return { category: '', subcategory: '', query: '' };
        }

        var params = new URLSearchParams(window.location.search || '');
        return {
          category: String(
            params.get('category') ||
            params.get('category_id') ||
            params.get('cat') ||
            ''
          ).trim(),
          subcategory: String(
            params.get('subcategory') ||
            params.get('subcat') ||
            ''
          ).trim(),
          query: String(params.get('q') || params.get('search') || '').trim()
        };
      }

      function trySelectCategory(rawValue) {
        if (!categoryFilter || !rawValue) {
          return false;
        }

        for (var i = 0; i < categoryFilter.options.length; i += 1) {
          if (categoryFilter.options[i].value === rawValue) {
            categoryFilter.value = rawValue;
            return true;
          }
        }

        var normalizedTarget = normalize(rawValue);
        for (var j = 0; j < categoryFilter.options.length; j += 1) {
          var option = categoryFilter.options[j];
          if (normalize(option.textContent) === normalizedTarget) {
            categoryFilter.value = option.value;
            return true;
          }
        }

        return false;
      }

      function trySelectSubcategory(rawValue) {
        if (!subcategoryFilter || !rawValue) {
          return false;
        }

        var normalizedTarget = normalize(rawValue);
        for (var i = 0; i < subcategoryFilter.options.length; i += 1) {
          var option = subcategoryFilter.options[i];
          if (normalize(option.value) === normalizedTarget || normalize(option.textContent) === normalizedTarget) {
            subcategoryFilter.value = option.value;
            return true;
          }
        }

        return false;
      }

      function init() {
        try {
          var data = readEmbeddedData();
          var initialFilters = getInitialFiltersFromUrl();
          items = Array.isArray(data.items) ? data.items.slice() : [];
          items.sort(function (a, b) {
            var categoryCmp = String(a.category_name || '').localeCompare(String(b.category_name || ''));
            if (categoryCmp !== 0) {
              return categoryCmp;
            }
            return formatItemLabel(a).localeCompare(formatItemLabel(b));
          });

          populateCategories(data.categories);
          trySelectCategory(initialFilters.category);

          var subcategories = populateSubcategories();
          if (subcategoryFilter) {
            if (!trySelectSubcategory(initialFilters.subcategory) && subcategories.length === 1) {
              subcategoryFilter.value = subcategories[0];
            }
          }

          if (searchInput && initialFilters.query) {
            searchInput.value = initialFilters.query;
          }

          generatedAtEl.textContent = formatDate(data.generated_at_utc);
          statusEl.style.color = '';
          statusEl.textContent = '';
          applyFilter();
          searchInput.focus();
        } catch (err) {
          showError('Error reading embedded collection data. (' + err.message + ')');
        }
      }

      function onCategoryChanged() {
        var subcategories = populateSubcategories();
        if (subcategoryFilter) {
          subcategoryFilter.value = subcategories.length === 1 ? subcategories[0] : '';
        }
        applyFilter();
      }

      searchInput.addEventListener('input', applyFilter);
      categoryFilter.addEventListener('change', onCategoryChanged);
      subcategoryFilter.addEventListener('change', applyFilter);
      refreshCacheBtn.addEventListener('click', refreshCachedCopy);
      init();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function (err) {
          console.log('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
